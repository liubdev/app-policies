<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器中编写、预览并导出应用政策页面">
  <title>政策页面编辑器 · App Policies</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="App Policies 首页">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span>App Policies<small>页面编辑</small></span>
    </a>
    <div class="top-actions">
      <button class="button button-quiet" id="save-button" type="button">保存草稿</button>
      <button class="button button-quiet" id="import-config-button" type="button">导入配置</button>
      <button class="button button-quiet" id="export-config" type="button">导出配置</button>
      <button class="button button-primary" id="download-html" type="button">下载网页</button>
      <input id="import-config" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main class="layout">
    <section class="intro" aria-labelledby="page-heading">
      <div>
        <h1 id="page-heading">政策页面编辑器</h1>
        <p class="intro-copy">填写内容后可在右侧预览。草稿保存在当前浏览器；下载 HTML 后，提交到自己的仓库即可发布。</p>
      </div>
      <a class="help-link" href="docs/hosting-guide.md">发布说明 <span aria-hidden="true">↗</span></a>
    </section>

    <div class="workspace">
      <section class="panel" aria-labelledby="editor-heading">
        <div class="panel-heading">
          <h2 id="editor-heading">页面内容</h2>
          <span class="local-badge"><span aria-hidden="true"></span>仅保存在此浏览器</span>
        </div>
        <p class="privacy-note">内容不会上传。发布前，请按应用的实际行为修改示例文字。</p>

        <div class="form-grid">
          <label class="field field-wide" for="product-name">产品名称
            <input id="product-name" type="text" maxlength="200" placeholder="例如：我的记账应用">
          </label>
          <label class="field" for="document-type">页面类型
            <select id="document-type">
              <option value="privacy">隐私政策</option>
              <option value="terms">用户协议</option>
              <option value="support">技术支持</option>
              <option value="custom">自定义页面</option>
            </select>
          </label>
          <label class="field" for="document-language">页面语言
            <select id="document-language">
              <option value="zh-Hans">简体中文</option>
              <option value="zh-Hant">繁體中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
            </select>
          </label>
          <label class="field field-wide" for="document-title">页面标题
            <input id="document-title" type="text" maxlength="200" placeholder="页面上显示的标题">
          </label>
          <label class="field" for="updated-date">更新日期
            <input id="updated-date" type="date">
          </label>
          <label class="field" for="contact-email">联系邮箱（可选）
            <input id="contact-email" type="email" maxlength="200" placeholder="privacy@example.com">
          </label>
        </div>

        <div class="section-heading">
          <h3>正文</h3>
          <button class="button button-small" id="add-section" type="button">添加章节</button>
        </div>
        <p class="field-hint">使用每段旁边的上移、下移按钮调整顺序。</p>
        <div class="sections" id="sections"></div>

        <details class="design-settings">
          <summary>页面外观与页脚</summary>
          <div class="form-grid design-grid">
            <label class="field" for="accent-color">强调色
              <span class="color-control"><input id="accent-color" type="color" value="#5367f5"><span id="accent-value">#5367F5</span></span>
            </label>
            <label class="field" for="content-width">正文宽度
              <select id="content-width"><option value="narrow">窄</option><option value="standard" selected>标准</option><option value="wide">宽</option></select>
            </label>
            <label class="field field-wide" for="footer-text">自定义页脚（可选）
              <input id="footer-text" type="text" maxlength="160" placeholder="留空时使用默认版权行">
            </label>
          </div>
        </details>
        <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
      </section>

      <aside class="preview-column" aria-labelledby="preview-heading">
        <div class="preview-toolbar">
          <h2 id="preview-heading">实时预览</h2>
          <span class="preview-label">页面预览</span>
        </div>
        <div class="preview-frame">
          <article class="document-preview" id="preview" aria-label="政策页面预览"></article>
        </div>
        <div class="publish-card">
          <div class="publish-icon" aria-hidden="true">↗</div>
          <div><strong>发布到 GitHub Pages</strong><p>将下载的 HTML 提交到仓库，再到 Settings → Pages 开启发布。</p></div>
        </div>
        <p class="legal-note"><strong>说明：</strong>本工具不提供法律意见。发布前请核对内容是否符合应用的实际数据处理方式。</p>
      </aside>
    </div>

    <footer class="site-footer">
      <span>草稿只保存在当前浏览器。</span>
      <a href="index.html">返回政策目录</a>
    </footer>
  </main>
</body>
</html>
